name: Claude Code Review

# Thin caller: the review itself lives in Thistle/github-workflows.
# See https://github.com/Thistle/github-workflows/tree/main/docs/claude-code-review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
  pull_request:
    types: [opened, ready_for_review]

jobs:
  claude-review:
    uses: Thistle/github-workflows/.github/workflows/claude-code-review.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
      repo_context: |
        - Read requirements.txt for backend dependency versions
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
