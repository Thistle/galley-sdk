name: Claude Code

# Thin caller: the responder itself lives in Thistle/github-workflows. The triggers
# must stay here — a workflow_call workflow cannot declare its own.
# See https://github.com/Thistle/github-workflows/tree/main/docs/claude-mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: Thistle/github-workflows/.github/workflows/claude-mention.yml@main
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
